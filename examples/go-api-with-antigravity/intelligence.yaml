# Example: Go API service with Google Antigravity
# Antigravity reads AGENTS.md natively, so always-on rules stay there and the
# adapter only adds what AGENTS.md cannot carry: glob-triggered rules, shared
# .agents/skills bundles and .agents/agents subagent definitions.

project:
  name: my-api

schema_version: "0.15.0"

sources:
  rules:
    - ".intelligence/packages/@ainova-systems/sync/rules"
    - "intelligence/rules"
  agents:
    - ".intelligence/packages/@ainova-systems/sync/agents"
    - "intelligence/agents"
  skills:
    - ".intelligence/packages/@ainova-systems/sync/skills"
    - "intelligence/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My API

      Go 1.22 HTTP API | Postgres | Antigravity example

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  antigravity: { enabled: true, output: ".agents" }

# CLI-owned blocks — the engine never reads below this line. The engine's own
# content is an ordinary package, pinned to the engine and restored offline
# from the CLI bundle.
packages:
  "@ainova-systems/sync":
    version: "0.15.0"

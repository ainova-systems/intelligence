# Example: pulling shared skills/rules from a remote git repo
# A pack is DECLARED once under `packs:` and referenced from `sources.*` by
# name — `@<pack>[/<subpath>]` — so the url and the pin live in exactly one
# place however many sections use them. Pin `ref:` to a tag or SHA so an
# upstream change can't silently alter your agents — see docs/CONVENTIONS.md
# "Packs (remote sources)". Paths/URLs here are EXAMPLES — use your own.

project:
  name: my-app

sync_version: "0.10.1"

packs:
  # `mirror:` materializes the pack into a tracked directory and commits it, so
  # bumping `ref:` reads as an ordinary diff. Drop the line and the pack stays
  # transient — cloned to a temp dir and gone at the end of the run.
  shared-intel:
    url: https://github.com/org/shared-intel.git
    ref: v1.2.0
    mirror: "intelligence/external/shared-intel"

sources:
  rules:
    - "intelligence/rules"
    - "intelligence/sync/rules"
    # Shared rules from a central repo, pinned by the pack above:
    - "@shared-intel/rules"
  agents:
    - "intelligence/agents"
    - "intelligence/sync/agents"
  skills:
    - "intelligence/skills"
    - "intelligence/sync/skills"
    # Shared skills from the SAME pack — one clone per sync, reused for the
    # rules entry above:
    - "@shared-intel/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My App

      Service with shared, centrally-managed intelligence pulled from git.

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  claude: { enabled: true, output: ".claude" }
  cursor: { enabled: true, output: ".cursor" }

# Example: pulling shared skills/rules from a remote git repo
# A remote source is a PACKAGE: declared once under `packages:` with its pin,
# referenced from `sources.*` by its store path. `intelligence package add` writes both
# halves — this file shows what it produces. Pin a `version:` range against the
# package's git tags, or `ref:` a branch/SHA when you want an exact commit and
# no range resolution. Paths/URLs here are EXAMPLES — use your own.

project:
  name: my-app

schema_version: "0.11.8"

# Package sources come first, project sources last: adapters copy in order and
# the last write wins, so a project file overrides a same-named package file.
sources:
  rules:
    - ".intelligence/packages/@ainova-systems/sync/rules"
    - ".intelligence/packages/@org/shared-intel/rules"
    - "intelligence/rules"
  agents:
    - ".intelligence/packages/@ainova-systems/sync/agents"
    - "intelligence/agents"
  skills:
    - ".intelligence/packages/@ainova-systems/sync/skills"
    - ".intelligence/packages/@org/shared-intel/skills"
    - "intelligence/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My App

      Service with shared, centrally-managed intelligence pulled from git.

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  claude: { enabled: true, output: ".claude" }
  cursor: { enabled: true, output: ".cursor" }

# CLI-owned blocks — the engine never reads below this line. The store itself
# is gitignored; `intelligence.lock` records the resolved tag and sha, so a
# fresh clone restores exactly this state with `intelligence sync`.
packages:
  "@ainova-systems/sync":
    version: "0.11.8"
  # A package resolved through the trust list below — the name is all the
  # manifest needs, the registry supplies the url.
  "@org/shared-intel":
    version: "^1.2.0"

registries:
  - "https://github.com/ainova-systems/intelligence-registry.git"

# Example: Platform with git submodules
# Submodules are separate repos — excluded from parent sync.
# They may have their own Intelligence project internally.
# Paths here are EXAMPLES — use whatever your repo actually has.

project:
  name: my-platform

schema_version: "0.11.0"

sources:
  rules:
    - ".intelligence/packages/@ainova-systems/sync/rules"
    - "intelligence/rules"
    - "api/intelligence/rules"
    - "web/intelligence/rules"
    - "deploy/intelligence/rules"
  agents:
    - ".intelligence/packages/@ainova-systems/sync/agents"
    - "intelligence/agents"
    - "api/intelligence/agents"
    - "web/intelligence/agents"
  skills:
    - ".intelligence/packages/@ainova-systems/sync/skills"
    - "intelligence/skills"
    - "api/intelligence/skills"
    - "web/intelligence/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My Platform

      Multi-component monorepo | API + Web + Deploy | Phase: platform migration

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  claude: { enabled: true, output: ".claude" }
  cursor: { enabled: true, output: ".cursor" }

ignore:
  - "node_modules"
  - "vendor"
  - "dist"

submodules:
  - "libs/shared-sdk"
  - "tools/ci-runner"

# CLI-owned blocks — the engine never reads below this line. The engine's own
# content is an ordinary package, pinned to the engine and restored offline
# from the CLI bundle.
packages:
  "@ainova-systems/sync":
    version: "0.11.0"
    url: "https://github.com/ainova-systems/intelligence.git"
    path: "packages/sync"

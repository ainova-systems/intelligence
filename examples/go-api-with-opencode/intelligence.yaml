# Example: Go API service with opencode
# Demonstrates the minimal config to enable the opencode adapter alongside
# the always-on AGENTS.md (which opencode reads natively).

project:
  name: my-api

schema_version: "0.11.9"

sources:
  rules:
    - ".intelligence/packages/@ainova-systems/sync/rules"
    - "intelligence/rules"
  agents:
    - ".intelligence/packages/@ainova-systems/sync/agents"
    - "intelligence/agents"
  skills:
    - ".intelligence/packages/@ainova-systems/sync/skills"
    - "intelligence/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My API

      Go 1.22 HTTP API | Postgres | opencode example

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  opencode: { enabled: true, output: ".opencode" }

# CLI-owned blocks — the engine never reads below this line. The engine's own
# content is an ordinary package, pinned to the engine and restored offline
# from the CLI bundle.
packages:
  "@ainova-systems/sync":
    version: "0.11.9"

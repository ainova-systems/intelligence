# Example: Go API service with opencode
# Demonstrates the minimal config to enable the opencode adapter alongside
# the always-on AGENTS.md (which opencode reads natively).

project:
  name: my-api

schema_version: "0.19.0"

sources:
  rules:
    - "package:sync/rules"
    - "intelligence/rules"
  agents:
    - "package:sync/agents"
    - "intelligence/agents"
  skills:
    - "package:sync/skills"
    - "intelligence/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My API

      Go 1.22 HTTP API | Postgres | opencode example

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  opencode: { enabled: true, output: ".opencode" }

# CLI-owned blocks — below this line the engine reads only the package names,
# which `package:` sources resolve against. The engine's own content is an
# ordinary package, pinned to the engine and restored offline from the CLI
# bundle.
packages:
  "@ainova-systems/sync":
    version: "0.19.0"

# Example: Go API service with Pi + Codex
# Demonstrates that Pi can coexist with Codex without conflicting over
# always-on rules (shared via AGENTS.md) or skills (shared via .agents/skills).

project:
  name: my-api

schema_version: "0.11.5"

sources:
  rules:
    - ".intelligence/packages/@ainova-systems/sync/rules"
    - "intelligence/rules"
  agents:
    - ".intelligence/packages/@ainova-systems/sync/agents"
    - "intelligence/agents"
  skills:
    - ".intelligence/packages/@ainova-systems/sync/skills"
    - "intelligence/skills"

targets:
  agents:
    enabled: true
    output: "AGENTS.md"
    header: |
      # My API

      Go 1.22 HTTP API | Postgres | Pi + Codex example

      **Full context**: [`intelligence/rules/context.md`](intelligence/rules/context.md)
  codex: { enabled: true, output: ".codex" }
  pi: { enabled: true, output: ".pi" }

# CLI-owned blocks — the engine never reads below this line. The engine's own
# content is an ordinary package, pinned to the engine and restored offline
# from the CLI bundle.
packages:
  "@ainova-systems/sync":
    version: "0.11.5"

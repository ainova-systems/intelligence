# Example: a project on the CLI setup (v2). The manifest lives at the REPO
# ROOT as intelligence.yaml; packages are installed into the gitignored
# .intelligence/ store and restored by `intelligence install`; the resolved
# state is committed in intelligence.lock next to this file.
#
# Nothing here is written by hand in practice: `intelligence init` generates
# it and `intelligence add` maintains packages: and the store's sources
# entries.
project:
  name: cli-project

sync_version: "0.11.0"

sources:
  rules:
    - "intelligence/rules"
    - ".intelligence/engine/rules"
    - ".intelligence/packages/@ainova-systems/core/rules"
  agents:
    - "intelligence/agents"
    - ".intelligence/engine/agents"
    - ".intelligence/packages/@ainova-systems/core/agents"
  skills:
    - "intelligence/skills"
    - ".intelligence/engine/skills"
    - ".intelligence/packages/@ainova-systems/core/skills"

targets:
  agents: { enabled: true, output: "AGENTS.md" }
  claude: { enabled: true, output: ".claude" }
  cursor: { enabled: true, output: ".cursor" }

# CLI-owned blocks — the engine never reads below this line.
packages:
  "@ainova-systems/core":
    version: "^0.3.0"

# Optional: bind a scope to a private registry (a git repo holding index.yaml).
# registries:
#   "@acme": "https://github.com/acme/intelligence-registry.git"

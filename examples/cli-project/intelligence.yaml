# Example: an Intelligence project. The manifest lives at the REPO
# ROOT as intelligence.yaml; packages are installed into the gitignored
# .intelligence/ store and restored automatically by `intelligence sync`; the resolved
# state is committed in intelligence.lock next to this file.
#
# Nothing here is written by hand in practice: `intelligence init` generates
# it and `intelligence package add` maintains packages: and their
# `package:<name>/<dir>` sources entries. The engine's own content
# (@ainova-systems/sync) is an ordinary package too — auto-added by init and
# aligned with the bundled engine by the universal project preflight.
project:
  name: cli-project

schema_version: "0.19.0"

# Package sources come first, project sources last: adapters copy in order
# and the last write wins, so a project file overrides a same-named package
# artifact.
sources:
  rules:
    - "package:core/rules"
    - "package:sync/rules"
    - "intelligence/rules"
  agents:
    - "package:core/agents"
    - "package:sync/agents"
    - "intelligence/agents"
  skills:
    - "package:core/skills"
    - "package:sync/skills"
    - "intelligence/skills"

targets:
  agents: { enabled: true, output: "AGENTS.md" }
  claude: { enabled: true, output: ".claude" }
  cursor: { enabled: true, output: ".cursor" }

# CLI-owned blocks — below this line the engine reads only the package names,
# which `package:` sources resolve against.
packages:
  "@ainova-systems/sync":
    version: "0.19.0"
  "@ainova-systems/core":
    version: "^0.3.0"

# Registries are this project's trust list — the only way names resolve:
# git repos holding an index.yaml, consulted in order. init seeds the default;
# delete a line to distrust that catalog.
registries:
  - "https://github.com/ainova-systems/intelligence-registry.git"

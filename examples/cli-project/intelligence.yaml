# Example: a project on the CLI setup (v2). The manifest lives at the REPO
# ROOT as intelligence.yaml; packages are installed into the gitignored
# .intelligence/ store and restored by `intelligence install`; the resolved
# state is committed in intelligence.lock next to this file.
#
# Nothing here is written by hand in practice: `intelligence init` generates
# it and `intelligence add` maintains packages: and the store's sources
# entries. The engine's own content (@ainova-systems/sync) is an ordinary
# package too — auto-added by init, pinned to the engine version, moved by
# `intelligence upgrade`.
project:
  name: cli-project

sync_version: "0.11.0"

# Package sources come first, project sources last: adapters copy in order
# and the last write wins, so a project file overrides a same-named package
# artifact.
sources:
  rules:
    - ".intelligence/packages/@ainova-systems/core/rules"
    - ".intelligence/packages/@ainova-systems/sync/rules"
    - "intelligence/rules"
  agents:
    - ".intelligence/packages/@ainova-systems/core/agents"
    - ".intelligence/packages/@ainova-systems/sync/agents"
    - "intelligence/agents"
  skills:
    - ".intelligence/packages/@ainova-systems/core/skills"
    - ".intelligence/packages/@ainova-systems/sync/skills"
    - "intelligence/skills"

targets:
  agents: { enabled: true, output: "AGENTS.md" }
  claude: { enabled: true, output: ".claude" }
  cursor: { enabled: true, output: ".cursor" }

# CLI-owned blocks — the engine never reads below this line.
packages:
  "@ainova-systems/sync":
    version: "0.11.0"
    url: "https://github.com/ainova-systems/intelligence-sync.git"
    path: "intelligence/sync"
  "@ainova-systems/core":
    version: "^0.3.0"

# Registries are a trust list: git repos holding an index.yaml, consulted in
# order before the CLI's bundled index and the @org/name GitHub convention.
# registries:
#   - "https://github.com/acme/intelligence-registry.git"

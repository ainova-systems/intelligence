# What THIS CLI distribution ships as its engine-content package, and which
# registry its init seeds into new manifests. Data, not code: a fork or an
# enterprise mirror edits this file (or its copy in the npm build) — nothing
# in cli/ names a vendor.
#
# The engine-content package is the one package whose content documents the
# engine scripts bundled with the CLI: init writes this entry into the
# manifest (visible, removable), its pin always equals the engine VERSION,
# `upgrade` moves it, and at the matching version it materializes from the
# bundle without network.
name: "@ainova-systems/sync"
url: "https://github.com/ainova-systems/intelligence.git"
path: "packages/sync"
default_registry: "https://github.com/ainova-systems/intelligence-registry.git"

name: release-npm

# Publishes @ainova-systems/intelligence.
#
# Publishing a GitHub Release is the only release action. The release tag is
# the npm version and selects the channel:
#   vX.Y.Z-rc.N -> npm dist-tag `next` (GitHub prerelease required)
#   vX.Y.Z      -> npm dist-tag `latest` (non-prerelease GitHub Release required)
# The tag's base X.Y.Z must match engine/VERSION, and its commit must be in
# main. engine/VERSION and schema_version never carry the npm RC suffix.
#
# Needs the NPM_TOKEN repo secret (granular token with publish rights on the
# ainova-systems npm org).

on:
  release:
    types: [published]

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Determine version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          ENGINE="$(tr -d ' \t\r\n' < engine/VERSION)"
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+[.][0-9]+[.][0-9]+)-rc[.]([1-9][0-9]*)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            VER="$BASE-rc.${BASH_REMATCH[2]}"
            DIST_TAG="next"
            EXPECTED_PRERELEASE="true"
          elif [[ "$RELEASE_TAG" =~ ^v([0-9]+[.][0-9]+[.][0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            VER="$BASE"
            DIST_TAG="latest"
            EXPECTED_PRERELEASE="false"
          else
            echo "release tag must be vX.Y.Z or vX.Y.Z-rc.N (got '$RELEASE_TAG')" >&2
            exit 1
          fi

          [ "$BASE" = "$ENGINE" ] || {
            echo "release base $BASE does not match engine/VERSION $ENGINE" >&2
            exit 1
          }
          [ "$RELEASE_PRERELEASE" = "$EXPECTED_PRERELEASE" ] || {
            echo "release prerelease=$RELEASE_PRERELEASE does not match tag '$RELEASE_TAG'" >&2
            exit 1
          }

          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "release tag '$RELEASE_TAG' is not on main" >&2
            exit 1
          }

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash npm/build.sh "${{ steps.ver.outputs.version }}"

      - name: Smoke the built package before publishing
        run: |
          set -euo pipefail
          cd npm/dist && npm pack --silent
          PREFIX="$RUNNER_TEMP/verify-prefix"
          npm install -g --prefix "$PREFIX" ./*.tgz
          "$PREFIX/bin/intelligence" version
          PROJ="$RUNNER_TEMP/verify-proj"
          mkdir -p "$PROJ" && cd "$PROJ" && git init -q .
          INIT_LOG="$RUNNER_TEMP/intelligence-init.log"
          init_rc=0
          "$PREFIX/bin/intelligence" init > "$INIT_LOG" 2>&1 || init_rc=$?
          cat "$INIT_LOG"
          [ "$init_rc" -eq 0 ] || exit "$init_rc"
          grep -q '^IS_STATUS=ok' "$INIT_LOG"

      - name: Publish
        run: cd npm/dist && npm publish --tag "${{ steps.ver.outputs.tag }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm pins `latest` to the FIRST version a package ever publishes,
      # whatever `--tag` said — so a package whose first release was a
      # prerelease serves that prerelease to every plain `npm i -g` until a
      # stable ships. While `latest` still points at a prerelease, keep it on
      # the newest one; the first stable publish takes it over for good.
      - name: Keep `latest` off a stale prerelease
        if: steps.ver.outputs.tag == 'next'
        run: |
          set -euo pipefail
          PKG="@ainova-systems/intelligence"
          CURRENT="$(npm view "$PKG" dist-tags.latest 2>/dev/null || true)"
          case "$CURRENT" in
            *-*)
              npm dist-tag add "$PKG@${{ steps.ver.outputs.version }}" latest
              echo "latest: $CURRENT -> ${{ steps.ver.outputs.version }} (no stable release yet)"
              ;;
            *)
              echo "latest is $CURRENT (stable) — left alone"
              ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

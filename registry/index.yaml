# The default Intelligence Registry index, bundled with the CLI.
#
# Maps a package name to the git repo (and path inside it) the package lives
# in. Needed exactly when a name is not the repo — monorepos like
# intelligence-dev-packs. A name absent here falls through to the convention:
# @org/name -> https://github.com/org/name.git, content at the repo root.
# Organizations override or extend this per scope with `intelligence registry
# add @scope <registry-repo-url>`.
packages:
  "@ainova-systems/core":
    url: "https://github.com/ainova-systems/intelligence-dev-packs.git"
    path: "packs/core"
  "@ainova-systems/spec":
    url: "https://github.com/ainova-systems/intelligence-dev-packs.git"
    path: "packs/spec"
